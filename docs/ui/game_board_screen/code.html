<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#2ed157",
            "background-light": "#f6f8f6",
            "background-dark": "#0a0f0b",
            "neon-red": "#ff3131",
            "neon-blue": "#00d2ff",
            "neon-yellow": "#fff01f",
            "neon-orange": "#ff9100",
            "neon-purple": "#bc13fe",
            "neon-pink": "#ff00ff",
            "board-slot": "#1a261e"
          },
          fontFamily: {
            "display": ["Space Grotesk"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    body { font-family: 'Space Grotesk', sans-serif; }
    .voxel-3d {
      box-shadow: inset -4px -4px 0px rgba(0,0,0,0.4), inset 4px 4px 0px rgba(255,255,255,0.2);
    }
    .neon-glow-primary {
      box-shadow: 0 0 15px rgba(46, 209, 87, 0.4);
    }
    .neon-glow-red { box-shadow: 0 0 12px rgba(255, 49, 49, 0.5); }
    .neon-glow-blue { box-shadow: 0 0 12px rgba(0, 210, 255, 0.5); }
    .neon-glow-green { box-shadow: 0 0 12px rgba(46, 209, 87, 0.5); }
    .neon-glow-yellow { box-shadow: 0 0 12px rgba(255, 240, 31, 0.5); }
    .neon-glow-orange { box-shadow: 0 0 12px rgba(255, 145, 0, 0.5); }
    .neon-glow-purple { box-shadow: 0 0 12px rgba(188, 19, 254, 0.5); }
    .neon-glow-pink { box-shadow: 0 0 12px rgba(255, 0, 255, 0.5); }
    .pixel-border {
        border: 4px solid;
        border-image-slice: 1;
        border-image-source: linear-gradient(to bottom right, #ffffff44, #00000044);
    }
    .active-row-indicator {
        background: linear-gradient(90deg, transparent 0%, rgba(46, 209, 87, 0.1) 50%, transparent 100%);
    }
  </style>
<title>Super Decoder - Game Board</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-start overflow-hidden font-display">
<!-- Main Phone Container -->
<div class="w-full max-w-md h-screen flex flex-col bg-background-dark relative border-x border-primary/10">
<!-- Top Bar -->
<header class="pt-12 pb-4 px-6 flex justify-between items-center border-b border-primary/20 bg-background-dark/80 backdrop-blur-md sticky top-0 z-50">
<div class="flex flex-col">
<span class="text-[10px] uppercase tracking-[0.2em] text-primary/60 font-bold">Current Level</span>
<div class="text-2xl font-bold text-primary tracking-tighter flex items-center gap-2">
<span class="bg-primary/10 px-2 py-0.5 rounded border border-primary/30">LV.042</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="text-[10px] uppercase tracking-[0.2em] text-primary/60 font-bold mb-1">Attempts Remaining</span>
<div class="flex gap-1.5">
<div class="w-2.5 h-2.5 rounded-full bg-primary neon-glow-primary"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary neon-glow-primary"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary neon-glow-primary"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary neon-glow-primary"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary/20 border border-primary/40"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary/20 border border-primary/40"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary/20 border border-primary/40"></div>
</div>
</div>
</header>
<!-- Game Board -->
<main class="flex-grow overflow-y-auto px-4 py-6 flex flex-col gap-3">
<!-- Row 7 (Past Move) -->
<div class="flex items-center justify-between p-2 rounded-lg opacity-40 grayscale-[0.5]">
<div class="flex gap-3">
<div class="w-12 h-12 bg-neon-purple voxel-3d rounded-lg"></div>
<div class="w-12 h-12 bg-neon-red voxel-3d rounded-lg"></div>
<div class="w-12 h-12 bg-neon-blue voxel-3d rounded-lg"></div>
<div class="w-12 h-12 bg-neon-yellow voxel-3d rounded-lg"></div>
</div>
<div class="grid grid-cols-2 gap-1.5 bg-background-dark/50 p-2 rounded border border-white/5">
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
<div class="w-2.5 h-2.5 rounded-full bg-white"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
</div>
</div>
<!-- Row 6 (Past Move) -->
<div class="flex items-center justify-between p-2 rounded-lg opacity-60">
<div class="flex gap-3">
<div class="w-12 h-12 bg-neon-blue voxel-3d rounded-lg"></div>
<div class="w-12 h-12 bg-neon-blue voxel-3d rounded-lg"></div>
<div class="w-12 h-12 bg-neon-orange voxel-3d rounded-lg"></div>
<div class="w-12 h-12 bg-neon-pink voxel-3d rounded-lg"></div>
</div>
<div class="grid grid-cols-2 gap-1.5 bg-background-dark/50 p-2 rounded border border-white/5">
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
</div>
</div>
<!-- Row 5 (Active Row) -->
<div class="flex items-center justify-between p-2 rounded-xl border-2 border-primary/50 active-row-indicator relative">
<div class="absolute -left-1 top-1/2 -translate-y-1/2 w-1 h-6 bg-primary rounded-full shadow-[0_0_10px_#2ed157]"></div>
<div class="flex gap-3">
<div class="w-12 h-12 bg-neon-red voxel-3d rounded-lg neon-glow-red border border-white/20"></div>
<div class="w-12 h-12 bg-neon-green voxel-3d rounded-lg neon-glow-green border border-white/20"></div>
<div class="w-12 h-12 bg-board-slot border-2 border-dashed border-primary/30 rounded-lg flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-primary/20 animate-pulse"></div>
</div>
<div class="w-12 h-12 bg-board-slot border-2 border-dashed border-primary/10 rounded-lg"></div>
</div>
<div class="grid grid-cols-2 gap-1.5 bg-black/40 p-2 rounded border border-primary/20">
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
</div>
</div>
<!-- Row 4-1 (Empty Rows) -->
<div class="flex items-center justify-between p-2 rounded-lg opacity-30">
<div class="flex gap-3">
<div class="w-12 h-12 bg-board-slot border border-white/5 rounded-lg"></div>
<div class="w-12 h-12 bg-board-slot border border-white/5 rounded-lg"></div>
<div class="w-12 h-12 bg-board-slot border border-white/5 rounded-lg"></div>
<div class="w-12 h-12 bg-board-slot border border-white/5 rounded-lg"></div>
</div>
<div class="grid grid-cols-2 gap-1.5 p-2">
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
</div>
</div>
<div class="flex items-center justify-between p-2 rounded-lg opacity-20">
<div class="flex gap-3">
<div class="w-12 h-12 bg-board-slot border border-white/5 rounded-lg"></div>
<div class="w-12 h-12 bg-board-slot border border-white/5 rounded-lg"></div>
<div class="w-12 h-12 bg-board-slot border border-white/5 rounded-lg"></div>
<div class="w-12 h-12 bg-board-slot border border-white/5 rounded-lg"></div>
</div>
<div class="grid grid-cols-2 gap-1.5 p-2">
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
</div>
</div>
</main>
<!-- Controls Section -->
<footer class="bg-background-dark/95 border-t-2 border-primary/20 p-6 flex flex-col gap-6 pb-12 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
<!-- Color Picker -->
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center">
<span class="text-[10px] uppercase tracking-[0.2em] text-primary/60 font-bold">Select Voxel Color</span>
<span class="text-[10px] uppercase tracking-[0.2em] text-primary/40 font-bold">8 Available</span>
</div>
<div class="flex justify-between gap-2 overflow-x-auto pb-2 scrollbar-hide">
<button class="flex-shrink-0 w-10 h-10 rounded-lg bg-neon-red voxel-3d neon-glow-red hover:scale-110 transition-transform"></button>
<button class="flex-shrink-0 w-10 h-10 rounded-lg bg-neon-blue voxel-3d neon-glow-blue hover:scale-110 transition-transform"></button>
<button class="flex-shrink-0 w-10 h-10 rounded-lg bg-primary voxel-3d neon-glow-green hover:scale-110 transition-transform"></button>
<button class="flex-shrink-0 w-10 h-10 rounded-lg bg-neon-yellow voxel-3d neon-glow-yellow hover:scale-110 transition-transform"></button>
<button class="flex-shrink-0 w-10 h-10 rounded-lg bg-neon-orange voxel-3d neon-glow-orange hover:scale-110 transition-transform"></button>
<button class="flex-shrink-0 w-10 h-10 rounded-lg bg-neon-purple voxel-3d neon-glow-purple hover:scale-110 transition-transform"></button>
<button class="flex-shrink-0 w-10 h-10 rounded-lg bg-white voxel-3d shadow-[0_0_12px_rgba(255,255,255,0.4)] hover:scale-110 transition-transform"></button>
<button class="flex-shrink-0 w-10 h-10 rounded-lg bg-neon-pink voxel-3d neon-glow-pink hover:scale-110 transition-transform"></button>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-4">
<button class="flex-1 bg-slate-800 hover:bg-slate-700 py-4 rounded-xl border-b-4 border-slate-900 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-2">
<span class="material-icons text-sm">backspace</span>
<span class="font-bold tracking-widest text-sm">CLEAR</span>
</button>
<button class="flex-[1.5] bg-primary hover:bg-primary/90 py-4 rounded-xl border-b-4 border-green-700 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-2">
<span class="material-icons text-background-dark font-bold">done_all</span>
<span class="font-bold tracking-widest text-background-dark">SUBMIT</span>
</button>
</div>
</footer>
<!-- Background Decorative Elements -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-[-1]">
<div class="absolute top-1/4 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-1/4 -right-20 w-64 h-64 bg-neon-blue/5 rounded-full blur-[100px]"></div>
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(circle at 2px 2px, #2ed157 1px, transparent 0); background-size: 24px 24px;"></div>
</div>
</div>
</body></html>
