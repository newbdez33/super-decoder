<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Super Decoder - Victory</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2ed157",
                        "background-light": "#f6f8f6",
                        "background-dark": "#122016",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'voxel': '0 4px 0 0 rgba(0,0,0,0.4), 0 8px 0 0 #1a7a33',
                        'voxel-pressed': '0 2px 0 0 rgba(0,0,0,0.4), 0 4px 0 0 #1a7a33',
                        'neon': '0 0 15px rgba(46, 209, 87, 0.6)',
                    }
                },
            },
        }
    </script>
<style>
        .pixel-border {
            box-shadow: 
                0 -4px 0 -2px #2ed157, 
                0 4px 0 -2px #2ed157, 
                -4px 0 0 -2px #2ed157, 
                4px 0 0 -2px #2ed157,
                0 -8px 0 -4px #122016, 
                0 8px 0 -4px #122016, 
                -8px 0 0 -4px #122016, 
                8px 0 0 -4px #122016;
        }
        .voxel-card {
            border-bottom: 8px solid #0a120c;
            border-right: 4px solid #0a120c;
        }
        .voxel-block {
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.3);
            position: relative;
        }
        .voxel-block::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: rgba(255,255,255,0.2);
        }
        .glitch-text {
            text-shadow: 2px 2px #000;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display overflow-hidden antialiased">
<!-- Background Game Preview (Blurred) -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-gradient-to-b from-background-dark/80 to-background-dark"></div>
<div class="grid grid-cols-4 gap-4 p-8 opacity-20 scale-110">
<!-- Simulated background game board -->
<div class="aspect-square bg-white/10 rounded-lg"></div>
<div class="aspect-square bg-white/10 rounded-lg"></div>
<div class="aspect-square bg-white/10 rounded-lg"></div>
<div class="aspect-square bg-white/10 rounded-lg"></div>
<div class="aspect-square bg-white/10 rounded-lg"></div>
<div class="aspect-square bg-white/10 rounded-lg"></div>
<div class="aspect-square bg-white/10 rounded-lg"></div>
<div class="aspect-square bg-white/10 rounded-lg"></div>
<div class="aspect-square bg-white/10 rounded-lg"></div>
<div class="aspect-square bg-white/10 rounded-lg"></div>
<div class="aspect-square bg-white/10 rounded-lg"></div>
<div class="aspect-square bg-white/10 rounded-lg"></div>
</div>
</div>
<!-- Victory Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-6 backdrop-blur-md bg-background-dark/60">
<!-- Main Result Card -->
<div class="w-full max-w-sm bg-[#1a2b1e] rounded-xl voxel-card border-2 border-primary/30 relative flex flex-col items-center p-8 overflow-visible">
<!-- Voxel Sparkles (Decorative) -->
<div class="absolute -top-4 -left-4 w-8 h-8 bg-primary/20 rotate-45"></div>
<div class="absolute -bottom-4 -right-4 w-12 h-12 bg-primary/10 rotate-12"></div>
<!-- Title Section -->
<div class="mb-8 text-center">
<h2 class="text-primary text-4xl font-black tracking-tighter uppercase glitch-text italic mb-1">
                    Code Cracked!
                </h2>
<div class="h-1 w-full bg-primary/20 rounded-full flex justify-center">
<div class="h-full w-1/2 bg-primary shadow-neon"></div>
</div>
</div>
<!-- Stars Rating -->
<div class="flex gap-2 mb-8">
<span class="material-icons text-5xl text-primary drop-shadow-[0_0_10px_rgba(46,209,87,0.8)]">star</span>
<span class="material-icons text-6xl text-primary -translate-y-2 drop-shadow-[0_0_15px_rgba(46,209,87,1)]">star</span>
<span class="material-icons text-5xl text-primary drop-shadow-[0_0_10px_rgba(46,209,87,0.8)]">star</span>
</div>
<!-- The Correct Code Display -->
<div class="bg-black/40 p-6 rounded-xl border border-white/5 w-full mb-8">
<p class="text-white/40 text-[10px] uppercase tracking-[0.2em] text-center mb-4 font-bold">Sequence Identified</p>
<div class="flex justify-center gap-3">
<div class="w-12 h-12 bg-primary voxel-block rounded-sm flex items-center justify-center">
<div class="w-4 h-4 bg-white/40 rotate-45"></div>
</div>
<div class="w-12 h-12 bg-blue-500 voxel-block rounded-sm flex items-center justify-center">
<div class="w-4 h-4 bg-white/40 rotate-45"></div>
</div>
<div class="w-12 h-12 bg-red-500 voxel-block rounded-sm flex items-center justify-center">
<div class="w-4 h-4 bg-white/40 rotate-45"></div>
</div>
<div class="w-12 h-12 bg-yellow-500 voxel-block rounded-sm flex items-center justify-center">
<div class="w-4 h-4 bg-white/40 rotate-45"></div>
</div>
</div>
</div>
<!-- Stats Row -->
<div class="flex justify-between w-full mb-10 px-4">
<div class="text-center">
<p class="text-white/40 text-[10px] uppercase font-bold">Time</p>
<p class="text-white text-xl font-bold">01:24</p>
</div>
<div class="w-[1px] bg-white/10"></div>
<div class="text-center">
<p class="text-white/40 text-[10px] uppercase font-bold">Attempts</p>
<p class="text-white text-xl font-bold">4/10</p>
</div>
<div class="w-[1px] bg-white/10"></div>
<div class="text-center">
<p class="text-white/40 text-[10px] uppercase font-bold">Score</p>
<p class="text-primary text-xl font-bold">8,450</p>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary hover:bg-primary/90 transition-all text-background-dark font-black text-xl py-4 rounded-lg shadow-voxel flex items-center justify-center gap-2 group mb-6 active:translate-y-1 active:shadow-voxel-pressed">
                NEXT LEVEL
                <span class="material-icons group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Secondary Actions -->
<div class="flex gap-4 w-full">
<button class="flex-1 bg-white/5 hover:bg-white/10 border border-white/10 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition-colors">
<span class="material-icons text-sm">home</span>
                    HOME
                </button>
<button class="flex-1 bg-white/5 hover:bg-white/10 border border-white/10 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition-colors">
<span class="material-icons text-sm">replay</span>
                    RETRY
                </button>
</div>
</div>
<!-- Floating Particles Effect -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-1/4 left-1/4 w-2 h-2 bg-primary/40 rounded-sm"></div>
<div class="absolute top-1/2 left-10 w-3 h-3 bg-primary/20 rounded-sm"></div>
<div class="absolute bottom-1/4 right-1/4 w-2 h-2 bg-primary/40 rounded-sm"></div>
<div class="absolute top-10 right-20 w-4 h-4 bg-primary/10 rounded-sm"></div>
<div class="absolute bottom-20 left-1/2 w-1 h-1 bg-primary/60 rounded-sm"></div>
</div>
</div>
<!-- Bottom System Indicator (iOS Style) -->
<div class="fixed bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/20 rounded-full z-[60]"></div>
</body></html>
