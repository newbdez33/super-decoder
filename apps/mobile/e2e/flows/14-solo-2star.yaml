appId: host.exp.Exponent
tags:
  - full
name: "14 - Solo Mode 2-Star Win"

---

# Launch app with fresh state so we're on level 1
# Level 1 secret: yellow, blue, red, green (4 colors available)
- openLink: "exp://localhost:8081"
- waitForAnimationToEnd:
    timeout: 10000

# Navigate to solo game
- tapOn:
    id: "btn-solo"
- assertVisible:
    id: "game-screen"

---

# Guess 1: red, green, blue, yellow (all wrong positions)
- tapOn:
    id: "color-red"
- tapOn:
    id: "color-green"
- tapOn:
    id: "color-blue"
- tapOn:
    id: "color-yellow"
- tapOn:
    id: "btn-submit"

---

# Guess 2: green, yellow, blue, red (still wrong)
- tapOn:
    id: "color-green"
- tapOn:
    id: "color-yellow"
- tapOn:
    id: "color-blue"
- tapOn:
    id: "color-red"
- tapOn:
    id: "btn-submit"

---

# Guess 3: blue, red, yellow, green (still wrong)
- tapOn:
    id: "color-blue"
- tapOn:
    id: "color-red"
- tapOn:
    id: "color-yellow"
- tapOn:
    id: "color-green"
- tapOn:
    id: "btn-submit"

---

# Guess 4: yellow, blue, red, green (CORRECT - 4th attempt = 2 stars)
- tapOn:
    id: "color-yellow"
- tapOn:
    id: "color-blue"
- tapOn:
    id: "color-red"
- tapOn:
    id: "color-green"
- tapOn:
    id: "btn-submit"

---

# Test 1: Win modal appears
- assertVisible:
    id: "result-modal"
- assertVisible:
    text: "CODE CRACKED!"

---

# Test 2: Shows solved in 4 steps
- assertVisible:
    text: "Solved in 4 / 7 steps"

---

# Test 3: Star rating container visible
- assertVisible:
    id: "star-rating"

---

# Test 4: 2 earned stars and 1 empty star
- assertVisible:
    id: "star-1"
- assertVisible:
    id: "star-2"
- assertVisible:
    id: "star-3"

---

# Test 5: Go home
- tapOn:
    id: "btn-home"
- assertVisible:
    id: "home-title"
