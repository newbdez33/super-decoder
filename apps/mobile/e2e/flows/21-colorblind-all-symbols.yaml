appId: host.exp.exponent
tags:
  - full
name: "21 - Colorblind All 8 Symbols"

---

# Launch app with fresh state
- launchApp:
    appId: host.exp.exponent
    clearState: true

# Test 1: Enable colorblind mode in Settings
- tapOn:
    id: "btn-settings"
- assertVisible:
    id: "toggle-colorblind"
- tapOn:
    id: "toggle-colorblind"
- tapOn:
    id: "btn-back"

---

# Test 2: Navigate to Duo setter (allows 8 colors)
- tapOn:
    id: "btn-duo"
- assertVisible:
    id: "duo-title"

---

# Test 3: Select 8 colors to show all symbols
- tapOn:
    id: "color-count-8"

---

# Test 4: Verify all 8 colorblind symbols visible in picker
# red=● blue=■ green=▲ yellow=◆ orange=★ purple=✚ white=○ pink=♥
- assertVisible:
    text: "●"
- assertVisible:
    text: "■"
- assertVisible:
    text: "▲"
- assertVisible:
    text: "◆"
- assertVisible:
    text: "★"
- assertVisible:
    text: "✚"
- assertVisible:
    text: "○"
- assertVisible:
    text: "♥"

---

# Test 5: Screenshot of all 8 colorblind symbols
- takeScreenshot: colorblind-all-8-symbols

---

# Test 6: Select 4 colors and enter game to verify symbols in slots
- tapOn:
    id: "color-orange"
- tapOn:
    id: "color-purple"
- tapOn:
    id: "color-white"
- tapOn:
    id: "color-pink"

---

# Confirm and enter game
- tapOn:
    id: "btn-confirm"
- assertVisible:
    id: "game-screen"

---

# Test 7: Verify all 8 symbols visible in game color picker
- assertVisible:
    text: "●"
- assertVisible:
    text: "■"
- assertVisible:
    text: "▲"
- assertVisible:
    text: "◆"
- assertVisible:
    text: "★"
- assertVisible:
    text: "✚"
- assertVisible:
    text: "○"
- assertVisible:
    text: "♥"

---

# Test 8: Screenshot in game with all symbols
- takeScreenshot: colorblind-game-all-symbols

---

# Clean up: go back home
- tapOn:
    id: "btn-back"
- tapOn:
    text: "Leave"
    optional: true

# Disable colorblind mode
- tapOn:
    id: "btn-settings"
- tapOn:
    id: "toggle-colorblind"
- tapOn:
    id: "btn-back"
- assertVisible:
    id: "home-title"
