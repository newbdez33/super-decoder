appId: host.exp.exponent
tags:
  - smoke
  - full
name: "03 - Solo Mode Lose"

---

# Launch app with fresh state so we're on level 1
- launchApp:
    appId: host.exp.exponent
    clearState: true

# Navigate to solo game
# Level 1 secret is yellow, blue, red, green
# We guess red, blue, green, yellow (wrong order) 7 times to lose
- tapOn:
    id: "btn-solo"
- assertVisible:
    id: "game-screen"

---

# Test 1: Submit 7 wrong guesses to exhaust attempts
# Guess 1: red, blue, green, yellow (wrong order)
- tapOn:
    id: "color-red"
- tapOn:
    id: "color-blue"
- tapOn:
    id: "color-green"
- tapOn:
    id: "color-yellow"
- tapOn:
    id: "btn-submit"

---

