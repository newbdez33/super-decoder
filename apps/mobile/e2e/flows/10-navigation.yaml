appId: host.exp.exponent
tags:
  - smoke
  - full
name: "10 - Navigation"

---

# Launch app with fresh state
- launchApp:
    appId: host.exp.exponent
    clearState: true

# Test 1: Home -> Solo -> Back -> Home
- tapOn:
    id: "btn-solo"
- assertVisible:
    id: "game-screen"
- tapOn:
    id: "btn-back"
- assertVisible:
    id: "home-title"

